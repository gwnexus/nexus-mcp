name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm trusted publishing (OIDC); replaces the NPM_TOKEN secret
  id-token: write

jobs:
  release:
    name: Publish to npm
    # npm trusted publishing only supports GitHub-hosted runners
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Smoke test packed tarball
        run: node scripts/smoke-test-tarball.mjs

      - name: Verify version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Publish to npm
        run: npm publish --access public

      - name: Wait for registry availability
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if [ "$(npm view "@gwdn/nexus-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "Registry serves @gwdn/nexus-mcp@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: @gwdn/nexus-mcp@$VERSION not visible on the registry after 5 minutes"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
